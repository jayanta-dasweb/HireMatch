upstream hirematch_api {
    server api:8000;
    keepalive 16;
}

upstream hirematch_web {
    server web:3000;
    keepalive 16;
}

# HTTP — redirect to HTTPS when TLS certs are present.
# For local prod smoke without certs, comment the return and use the server below on :80 only.
server {
    listen 80;
    server_name _;

    # ACME / health without forcing HTTPS during bootstrap
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /api/ {
        limit_req zone=api_limit burst=40 nodelay;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection "";
        proxy_pass http://hirematch_api;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_pass http://hirematch_web;
    }
}

